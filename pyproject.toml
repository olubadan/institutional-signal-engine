[project]
name = "institutional-signal-engine"
version = "0.1.0"
description = "Deterministic, signal-only institutional market-data engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "websockets>=13,<16",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/institutional_signal_engine"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: explicitly isolated provider or database integration test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
